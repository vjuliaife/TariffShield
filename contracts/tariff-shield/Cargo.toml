[package]
name = "tariff-shield"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Soroban customs-bond collateral escrow contract"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# soroban-env-host 22.1.3 declares ed25519-dalek = ">=2.0.0" with no upper
# bound; without this pin cargo resolves the incompatible 3.x line for that
# edge (ChaCha20Rng no longer implements the CryptoRng bound dalek 3 needs),
# breaking `cargo test`/`cargo clippy` under the testutils feature.
#
# Re-validated for #896: every 22.x (latest 22.1.4) and 23.x soroban-env-host
# release still declares ">=2.0.0", so the pin stays while soroban-sdk is on
# 22.x. soroban-env-host bounds dalek itself (^2.0.0) from 25.2.2, 26.1.4,
# 27.0.1 and 28.0.0 onwards; once soroban-sdk is bumped to a line that
# resolves one of those, delete this pin. `npm run check:toolchain` (and the
# scripts test suite) fails if the pin and the locked soroban-env-host drift.
ed25519-dalek = "2"
