name: Deploy Staging

on:
  push:
    branches:
      - main

# Staging must always reflect the newest commit on main. Serialise runs per
# branch and cancel any in-flight run so two closely-landed merges cannot
# finish out of order and leave staging on a stale build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# The workflow only reads the repository; deploy credentials come from the
# `staging` environment secrets, not from GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trigger Render Staging Deploy Hook
        run: |
          if [ -z "${{ secrets.STAGING_RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "STAGING_RENDER_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          curl -X POST "${{ secrets.STAGING_RENDER_DEPLOY_HOOK_URL }}"

      - name: Deploy Web to Vercel Staging
        # Pinned to the commit behind tag v25.2.0. Third-party actions are
        # pinned by full SHA so a retagged release cannot silently change what
        # runs with the Vercel deploy token. See docs/deployment.md ("Pinned
        # third-party GitHub Actions") before bumping.
        uses: amondnet/vercel-action@16e87c0a08142b0d0d33b76aeaf20823c381b9b9 # v25.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          working-directory: ./apps/web
          build-env: |
            NEXT_PUBLIC_API_URL=https://tariffshield-api-staging.onrender.com
            NEXT_PUBLIC_STELLAR_NETWORK=testnet
            NEXT_PUBLIC_CONTRACT_ID=${{ secrets.STAGING_CONTRACT_ID }}

      - name: Poll Staging Health Endpoint
        run: |
          echo "Waiting for staging API deployment to propagate..."
          # Poll the health endpoint for up to 5 minutes (300 seconds) with a 15-second interval
          for i in {1..20}; do
            if curl -s -f https://tariffshield-api-staging.onrender.com/health; then
              echo "Staging API is healthy and reachable!"
              exit 0
            fi
            echo "Staging API is not ready yet, retrying in 15 seconds... ($i/20)"
            sleep 15
          done
          echo "Staging API failed to become healthy within 5 minutes."
          exit 1

      - name: Report Staging Deployment Status
        run: echo "Staging deployed successfully for commit ${{ github.sha }}"
