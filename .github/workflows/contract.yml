name: Contract

on:
  pull_request:
  push:
    branches: [main]

env:
  # Fails the build if the release .wasm exceeds this size. Override per-run
  # via workflow_dispatch inputs or by editing this value.
  MAX_WASM_BYTES: 102400

jobs:
  test-and-size-budget:
    name: cargo test + wasm size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-contract-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo test
        run: cargo test --workspace

      - name: Build contract wasm (release)
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Enforce wasm size budget
        run: |
          WASM_PATH="target/wasm32-unknown-unknown/release/tariff_shield.wasm"
          if [ ! -f "$WASM_PATH" ]; then
            echo "::error::wasm artifact not found at $WASM_PATH"
            exit 1
          fi
          SIZE=$(stat -c%s "$WASM_PATH")
          echo "wasm size: $SIZE bytes (budget: $MAX_WASM_BYTES bytes)"
          if [ "$SIZE" -gt "$MAX_WASM_BYTES" ]; then
            echo "::error::$WASM_PATH is $SIZE bytes, exceeding the $MAX_WASM_BYTES byte budget"
            exit 1
          fi
