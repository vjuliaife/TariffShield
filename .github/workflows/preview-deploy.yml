name: Vercel Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      deployments: write

    env:
      SERVICE: Web (Vercel Preview)
      ENVIRONMENT: preview
      DEPLOYER: ${{ github.actor }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHORT_SHA=$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Deploy to Vercel preview
        id: vercel
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          working-directory: ./apps/web
          github-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          VERCEL_ENV: preview
          NEXT_PUBLIC_API_URL: ${{ vars.STAGING_API_URL }}

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: ./.github/slack/deploy-success.json
          payload-templated: true
        env:
          DEPLOY_URL: ${{ steps.vercel.outputs.preview-url }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: ./.github/slack/deploy-failure.json
          payload-templated: true
