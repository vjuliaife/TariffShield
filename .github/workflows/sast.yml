name: SAST Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      
      # Migrated from deprecated returntocorp/semgrep-action@v1 to maintained semgrep/semgrep-action SHA pin (v1)
      - name: Semgrep Scan
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/default
            p/javascript
            p/typescript
            p/rust
            .semgrep/rules.yml

