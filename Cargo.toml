[workspace]
resolver = "2"
members = ["contracts/tariff-shield"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["TariffShield contributors"]

[workspace.dependencies]
soroban-sdk = "27.0.4"
# Developer tooling: cargo-watch v8.5.2 (install via `cargo install cargo-watch --version 8.5.2`)

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
